
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RectColumn</title>
  <style>
    :root{color-scheme:dark}
    body{margin:0;font-family:Arial,sans-serif;background:#0a0c14;color:#e5e7eb}
    .wrap{max-width:560px;margin:0 auto;padding:16px}
    .card{background:#131722;border:1px solid #2a2f3a;border-radius:16px;padding:16px;margin:12px 0}
    h1{font-size:28px;line-height:1.15;margin:0 0 12px}
    p{font-size:18px;line-height:1.45;margin:10px 0}
    .btn{display:block;text-align:center;text-decoration:none;padding:14px 16px;border-radius:12px;font-weight:700;font-size:18px;margin:12px 0;background:#2563eb;color:#fff}
    .btn.alt{background:#2a2f3a;color:#e5e7eb}
    .muted{color:#94a3b8;font-size:16px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>RectColumn</h1>
      <p>Это служебная страница устройства.</p>
      <p class="muted">Первичная настройка сети открывается через мастер WiFi. Основной экран управления — отдельный интерфейс оператора.</p>
    </div>
    <a class="btn" href="/wifi">Открыть настройку WiFi</a>
    <a class="btn alt" href="/app">Открыть экран управления</a>
  </div>
</body>
</html>
